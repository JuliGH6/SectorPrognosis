name: Generate Live 40-Day & 1-Year Sector Forecast

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install numpy pandas pyarrow scipy scikit-learn lightgbm xgboost catboost yfinance
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run 100% Free-Public-Data Live Forecaster
        run: |
          python -m sector_prognosis.live_free_data

      - name: Commit timestamped 40-day forecast to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forecasts/latest_40d_forecast.csv forecasts/latest_summary.json
          git diff --cached --quiet || git commit -m "Add live 40-day and 1-year sector forecast"
          git push
