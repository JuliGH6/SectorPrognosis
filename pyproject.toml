[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sector-prognosis"
version = "2.0.0"
description = "Leakage-free S&P 500 sector 1-year return forecasting with prior-anchored decomposed ensembles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "python-calamine>=0.2",
    "openpyxl>=3.1",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.1",
    "catboost>=1.2",
    "torch>=2.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pytest>=8.0",
    "yfinance>=0.2.40",
]

[tool.setuptools.packages.find]
where = ["src"]
